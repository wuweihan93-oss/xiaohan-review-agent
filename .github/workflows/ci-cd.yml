name: 小晗 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一分支的部署依次完成，避免取消正在更新容器的任务。
concurrency:
  group: xiaohan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 测试后端、数据库和前端
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xiaohan_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xiaohan_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 只连接本次 CI 的临时数据库，不需要任何线上密钥。
      DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/xiaohan_ci?sslmode=disable
      XIAOHAN_POSTGRES_TESTS: '1'
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: 安装后端锁定依赖
        working-directory: backend
        run: uv sync --frozen --no-dev
      - name: 运行后端与 PostgreSQL 集成测试
        working-directory: backend
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: 验证部署成功与失败回退流程
        run: |
          bash -n scripts/deploy_via_ssh.sh deploy/apply-release.sh
          python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 前端兼容性测试与构建
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

  build:
    name: 构建并推送 Linux 镜像
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 检查仓库配置并生成镜像地址
        id: images
        env:
          EVENT_NAME: ${{ github.event_name }}
          REGISTRY_HOST: ${{ vars.REGISTRY_HOST }}
          REGISTRY_NAMESPACE: ${{ vars.REGISTRY_NAMESPACE }}
          REVISION: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            backend_repository=xiaohan-review-backend
            frontend_repository=xiaohan-review-frontend
          else
            [[ "$REGISTRY_HOST" =~ ^[a-z0-9][a-z0-9.-]*(:[0-9]{1,5})?$ ]] || {
              echo '仓库配置错误：REGISTRY_HOST 需要填写仓库域名，不含 https:// 和命名空间。' >&2
              exit 1
            }
            [[ "$REGISTRY_NAMESPACE" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
              echo '仓库配置错误：请配置 REGISTRY_NAMESPACE，使用小写字母、数字、点、下划线或连字符。' >&2
              exit 1
            }
            backend_repository="$REGISTRY_HOST/$REGISTRY_NAMESPACE/xiaohan-review-backend"
            frontend_repository="$REGISTRY_HOST/$REGISTRY_NAMESPACE/xiaohan-review-frontend"
          fi
          printf '%s\n' "backend_repository=$backend_repository" "frontend_repository=$frontend_repository" \
            "backend=$backend_repository:$REVISION" "frontend=$frontend_repository:$REVISION" >> "$GITHUB_OUTPUT"
      - name: 登录国内镜像仓库
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: 构建后端镜像
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/backend.Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.images.outputs.backend }}
          build-args: |
            DEBIAN_MIRROR=https://deb.debian.org
            PYPI_INDEX=https://pypi.org/simple
          cache-from: type=gha,scope=xiaohan-backend
          cache-to: type=gha,mode=max,scope=xiaohan-backend
      - name: 构建前端镜像
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/frontend.Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: ${{ steps.images.outputs.frontend }}
          cache-from: type=gha,scope=xiaohan-frontend
          cache-to: type=gha,mode=max,scope=xiaohan-frontend
      - name: 打包部署配置（不含镜像）
        if: github.event_name != 'pull_request'
        env:
          REVISION: ${{ github.sha }}
          BACKEND_REPOSITORY: ${{ steps.images.outputs.backend_repository }}
          FRONTEND_REPOSITORY: ${{ steps.images.outputs.frontend_repository }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ && "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo '打包失败：镜像构建没有返回有效的内容摘要。' >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/xiaohan-release"
          cp compose.yaml "$RUNNER_TEMP/xiaohan-release/compose.yaml"
          cp deploy/apply-release.sh "$RUNNER_TEMP/xiaohan-release/apply-release.sh"
          printf '%s\n' "$REVISION" > "$RUNNER_TEMP/xiaohan-release/REVISION"
          printf '%s@%s\n' "$BACKEND_REPOSITORY" "$BACKEND_DIGEST" > "$RUNNER_TEMP/xiaohan-release/BACKEND_IMAGE"
          printf '%s@%s\n' "$FRONTEND_REPOSITORY" "$FRONTEND_DIGEST" > "$RUNNER_TEMP/xiaohan-release/FRONTEND_IMAGE"
          mkdir -p dist-release
          tar -C "$RUNNER_TEMP/xiaohan-release" -czf dist-release/xiaohan-release.tar.gz .
          cd dist-release
          sha256sum xiaohan-release.tar.gz > xiaohan-release.tar.gz.sha256
          ls -lh xiaohan-release.tar.gz
      - name: 保存部署包
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: xiaohan-release-${{ github.sha }}
          path: dist-release/
          compression-level: 0
          retention-days: 2

  deploy:
    name: 更新 Ubuntu 服务
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xiaohan-release-${{ github.sha }}
          path: dist-release
      - name: 通过 SSH 下发配置并拉取镜像部署
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/ubuntu/apps/xiaohan-review-agent' }}
          REVISION: ${{ github.sha }}
        run: bash scripts/deploy_via_ssh.sh dist-release/xiaohan-release.tar.gz
