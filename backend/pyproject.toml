[project]
name = "xiaohan-review-agent"
version = "0.1.0"
description = "A compact study coach built with LangChain, RAG, Milvus, MCP, and FastAPI"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.135.1",
    "uvicorn[standard]==0.46.0",
    "python-multipart==0.0.33",
    "langchain==1.2.12",
    "langchain-openai==1.1.11",
    "langchain-text-splitters==1.1.1",
    "langchain-mcp-adapters==0.2.1",
    "fastmcp==3.2.4",
    "pymilvus[milvus-lite]==2.6.12",
    "fastembed==0.9.1",
    "pypdf==6.1.3",
    "python-docx==1.2.0",
    "python-dotenv==1.2.1",
    "httpx==0.28.1",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
    "langchain-deepseek>=1.1.0",
]

[tool.uv]
package = false
